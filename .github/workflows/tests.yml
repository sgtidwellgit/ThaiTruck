name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        pandas-version: ["1.5.*", "2.*"]
        exclude:
          # pandas 1.5 predates Python 3.12 support
          - python-version: "3.12"
            pandas-version: "1.5.*"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.pandas-version }}" = "1.5.*" ]; then
            # pandas 1.5's compiled extensions are ABI-incompatible with
            # numpy>=2.0. Its own dependency metadata predates numpy 2.0's
            # release, so it declares no upper bound and pip will happily
            # resolve numpy 2.x anyway, which crashes at import time. Pin
            # numpy explicitly for this leg only.
            pip install -e ".[dev,excel]" "pandas==1.5.*" "numpy<2"
          else
            pip install -e ".[dev,excel]" "pandas==${{ matrix.pandas-version }}"
          fi

      - name: Run tests
        run: pytest
